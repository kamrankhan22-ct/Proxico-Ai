<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Proxico AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#e8e6f0;font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
.header{width:100%;max-width:720px;padding:28px 24px 16px;border-bottom:1px solid #1e1e2e}
.title-small{font-size:11px;letter-spacing:.25em;color:#6c6a7c;text-transform:uppercase;margin-bottom:4px}
.title{font-size:28px;font-weight:bold;color:#f0eeff}
.messages{flex:1;width:100%;max-width:720px;padding:24px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;min-height:calc(100vh - 160px)}
.empty{text-align:center;color:#3e3c54;padding-top:60px;font-size:15px;line-height:1.8}
.msg{display:flex;flex-direction:column}
.msg.user{align-items:flex-end}
.msg.bot{align-items:flex-start}
.label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px}
.msg.user .label{color:#5a5078}
.msg.bot .label{color:#3a5870}
.bubble{max-width:85%;padding:12px 16px;font-size:15px;line-height:1.7;white-space:pre-wrap}
.msg.user .bubble{background:#1e1830;border:1px solid #2e2848;border-radius:16px 16px 4px 16px;color:#d4cff0}
.msg.bot .bubble{background:#111424;border:1px solid #1a2035;border-radius:16px 16px 16px 4px;color:#c0cce0}
.input-area{width:100%;max-width:720px;padding:16px 24px 28px;position:sticky;bottom:0;background:linear-gradient(transparent,#0a0a0f 30%)}
.input-box{display:flex;gap:10px;background:#111018;border:1px solid #2a2840;border-radius:14px;padding:4px 4px 4px 16px}
textarea{flex:1;background:transparent;border:none;color:#ddd8f8;font-family:Georgia,serif;font-size:15px;resize:none;outline:none;padding:10px 0;line-height:1.5}
textarea::placeholder{color:#3a3858}
button{background:#3d2f6e;border:none;border-radius:10px;width:42px;height:42px;color:#c8b8ff;font-size:18px;cursor:pointer;align-self:flex-end}
button:disabled{background:#1a1830;color:#3a3858}
@keyframes pulse{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.dot{width:6px;height:6px;border-radius:50%;background:#4a4878;animation:pulse 1.2s infinite}
</style>
</head>
<body>
<div class="header">
  <div class="title-small">Welcome to</div>
  <div class="title">Proxico AI ✦</div>
</div>
<div class="messages" id="messages">
  <div class="empty">◈<br/>Ask me anything.</div>
</div>
<div class="input-area">
  <div class="input-box">
    <textarea id="input" placeholder="Type your message…" rows="1"></textarea>
    <button id="send">↑</button>
  </div>
</div>
<script>
const API_KEY = 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;
const messages = [];
const msgsEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");

function addMessage(role, content) {
  const div = document.createElement("div");
  div.className = `msg ${role === "user" ? "user" : "bot"}`;
  div.innerHTML = `<div class="label">${role === "user" ? "You" : "Proxico AI"}</div><div class="bubble">${content}</div>`;
  msgsEl.appendChild(div);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  if (msgsEl.querySelector(".empty")) msgsEl.querySelector(".empty").remove();
  messages.push({role: "user", content: text});
  addMessage("user", text);
  inputEl.value = "";
  sendBtn.disabled = true;

  const loadDiv = document.createElement("div");
  loadDiv.className = "msg bot";
  loadDiv.innerHTML = `<div class="label">Proxico AI</div><div class="bubble" style="display:flex;gap:6px"><div class="dot" style="animation-delay:0s"></div><div class="dot" style="animation-delay:.2s"></div><div class="dot" style="animation-delay:.4s"></div></div>`;
  msgsEl.appendChild(loadDiv);
  msgsEl.scrollTop = msgsEl.scrollHeight;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": API_KEY,
        "anthropic-version": "2023-06-01"
      },
      body: JSON.stringify({model: "claude-haiku-4-5-20251001", max_tokens: 1000, messages})
    });
    const data = await res.json();
    const reply = data.content?.map(b => b.text || "").join("") || "No response.";
    messages.push({role: "assistant", content: reply});
    loadDiv.remove();
    addMessage("bot", reply);
  } catch(e) {
    loadDiv.remove();
    addMessage("bot", "⚠️ Error. Please try again.");
  }
  sendBtn.disabled = false;
}

sendBtn.onclick = send;
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
